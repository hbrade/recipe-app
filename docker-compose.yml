version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: recipes123
      POSTGRES_DB: recipes
    ports:
      - "5432:5432"
    volumes:
      - recipe_data:/var/lib/postgresql/data

  api:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:recipes123@db:5432/recipes?sslmode=disable
    depends_on:
      - db

  web:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8080/api
    depends_on:
      - api

volumes:
  recipe_data: